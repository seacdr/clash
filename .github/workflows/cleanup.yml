
name: Clear Project History

on:
  workflow_dispatch:
    inputs:
      clear_git_history:
        description: "重置默认分支的全部 Git 提交历史"
        required: true
        type: boolean
        default: false
      clear_action_runs:
        description: "删除历史 GitHub Actions 运行记录"
        required: true
        type: boolean
        default: false
      confirmation:
        description: "必须输入 DELETE_ALL_HISTORY 才会执行"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: clear-project-history
  cancel-in-progress: false

jobs:
  clear:
    if: github.event.inputs.confirmation == 'DELETE_ALL_HISTORY'
    runs-on: ubuntu-latest

    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ inputs.clear_git_history }}" != "true" &&
                "${{ inputs.clear_action_runs }}" != "true" ]]; then
            echo "No cleanup option selected."
            exit 1
          fi

      - name: Checkout complete repository
        if: inputs.clear_git_history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Delete historical workflow runs
        if: inputs.clear_action_runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Listing workflow runs..."

          gh api --paginate \
            "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' > /tmp/run-ids.txt

          while read -r run_id; do
            [[ -z "$run_id" ]] && continue

            # 当前任务不能可靠地删除自身，故跳过
            if [[ "$run_id" == "$CURRENT_RUN_ID" ]]; then
              echo "Skipping current run: $run_id"
              continue
            fi

            echo "Deleting workflow run: $run_id"

            gh api --method DELETE \
              "repos/$REPO/actions/runs/$run_id" \
              || {
                echo "Failed to delete run $run_id"
                exit 1
              }
          done < /tmp/run-ids.txt

      - name: Reset default branch Git history
        if: inputs.clear_git_history
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # 保留当前默认分支的文件内容，创建无父提交的新历史
          git checkout --orphan clean-history
          git add -A

          git commit -m "chore: reset repository history"

          # 只重写默认分支，不删除其他分支和标签
          git push --force origin \
            HEAD:"refs/heads/$DEFAULT_BRANCH"

          echo "Default branch history has been reset."
