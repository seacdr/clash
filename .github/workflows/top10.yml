name: Auto Sub Top10

on:
  workflow_dispatch:

  schedule:
    # 每 30 分钟执行一次
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: top10-update
  cancel-in-progress: true

jobs:
  update-top10:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python - <<'PY'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/SagerNet/sing-box/releases/latest",
              headers={"User-Agent": "top10-node-collector"}
          )

          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.load(r)

          print(data["tag_name"].lstrip("v"))
          PY
          )"

          echo "Installing sing-box ${VERSION}"

          ARCHIVE="sing-box-${VERSION}-linux-amd64.tar.gz"
          URL="https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/${ARCHIVE}"

          SB_DIR="$RUNNER_TEMP/sing-box"
          SB_ARCHIVE="$RUNNER_TEMP/sing-box.tar.gz"

          rm -rf "$SB_DIR"
          mkdir -p "$SB_DIR"

          curl -fL --retry 3 \
            --connect-timeout 15 \
            --max-time 120 \
            "$URL" \
            -o "$SB_ARCHIVE"

          tar -xzf "$SB_ARCHIVE" -C "$SB_DIR"

          BIN="$SB_DIR/sing-box-${VERSION}-linux-amd64/sing-box"

          if [ ! -f "$BIN" ]; then
            echo "Expected sing-box binary not found:"
            echo "$BIN"
            echo
            echo "Extracted files:"
            find "$SB_DIR" -maxdepth 3 -type f -print
            exit 1
          fi

          chmod +x "$BIN"

          sudo install -m 0755 "$BIN" /usr/local/bin/sing-box

          echo "Installed:"
          sing-box version

      - name: Download, benchmark and rank Top10
        env:
          SPEED_CANDIDATES: "30"
          SPEED_WORKERS: "8"
          SPEED_SECONDS: "8"
          SPEED_TIMEOUT: "15"
        run: |
          python scripts/top10.py

      - name: Show result
        run: |
          echo "========== output/top10.txt =========="
          cat output/top10.txt
          echo "======================================"

      - name: Commit changes
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"

          git add output/top10.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update Top10 nodes by latency and speed"
            git push
          fi
