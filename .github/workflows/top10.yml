name: Auto Sub Top10
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install sing-box
        run: |
          SING_BOX_VERSION="1.13.19"
          curl -LO "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          sudo mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/
          sing-box version

      - name: Install Python Dependencies
        run: |
          pip install requests

      - name: Run Speed Test Script
        run: |
          mkdir -p output
          python -u scripts/top10.py   # -u 参数，强制实时无缓冲输出

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/top10.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update top 10 nodes [skip ci]" && git push)
