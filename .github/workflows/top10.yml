name: Auto Sub Top10

on:
  workflow_dispatch:

  schedule:
    # 每 30 分钟执行一次
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: top10-update
  cancel-in-progress: true

jobs:
  update-top10:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install sing-box
        run: |
          set -euo pipefail
          # 1. 创建专用临时工作目录
          mkdir -p /tmp/sing-box-install
          cd /tmp/sing-box-install
          
          # 2. 下载与解压
          curl -sSL -O https://github.com/SagerNet/sing-box/releases/download/v1.13.19/sing-box-1.13.19-linux-amd64.tar.gz
          tar -xzf sing-box-1.13.19-linux-amd64.tar.gz
          
          # 3. 明确指明路径移动文件，不使用 find 命令
          sudo cp sing-box-1.13.19-linux-amd64/sing-box /usr/local/bin/
          sudo chmod +x /usr/local/bin/sing-box
          
          # 4. 清理临时文件
          cd / && rm -rf /tmp/sing-box-install

      - name: Download, benchmark and rank Top10
        env:
          SPEED_CANDIDATES: "30"
          SPEED_WORKERS: "8"
          SPEED_SECONDS: "8"
          SPEED_TIMEOUT: "15"
        run: |
          python scripts/top10.py

      - name: Show result
        run: |
          echo "========== output/top10.txt =========="
          cat output/top10.txt
          echo "======================================"

      - name: Commit changes
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"

          git add output/top10.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update Top10 nodes by latency and speed"
            git push
          fi
