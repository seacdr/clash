name: Auto Sub Top10

on:
  workflow_dispatch:

  schedule:
    # 每 30 分钟执行一次
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: top10-update
  cancel-in-progress: true

jobs:
  update-top10:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python - <<'PY'
          import json
          import urllib.request

          req = urllib.request.Request(
              "https://api.github.com/repos/SagerNet/sing-box/releases/latest",
              headers={"User-Agent": "top10-node-collector"}
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.load(r)

          print(data["tag_name"].lstrip("v"))
          PY
          )"

          echo "Installing sing-box ${VERSION}"

          ARCHIVE="sing-box-${VERSION}-linux-amd64.tar.gz"
          URL="https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/${ARCHIVE}"

          curl -fL --retry 3 "$URL" -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp

          BIN="$(find /tmp -type f -name sing-box -perm -111 | head -n 1)"
          test -n "$BIN"

          sudo install -m 0755 "$BIN" /usr/local/bin/sing-box
          sing-box version

      - name: Download, benchmark and rank Top10
        env:
          SPEED_CANDIDATES: "30"
          SPEED_WORKERS: "8"
          SPEED_SECONDS: "8"
          SPEED_TIMEOUT: "15"
        run: |
          python scripts/top10.py

      - name: Show result
        run: |
          echo "========== output/top10.txt =========="
          cat output/top10.txt
          echo "======================================"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/top10.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update Top10 nodes by latency and speed"
            git push
          fi
